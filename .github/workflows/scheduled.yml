name: Scheduled

# Weekly check against what was published since the last PR: the Compose compiler-plugin variants
# are run through the newest stable Kotlin release, so a compiler change that breaks injection
# surfaces within a week instead of at the next release (issue #59). Nothing here gates a PR.
# Scheduled workflows only run from the default branch; use "Run workflow" to try it by hand.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newest-kotlin:
    name: compose matrix on the newest Kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RELEASE: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Newest STABLE release: maven-metadata's <release> also lists betas and RCs, so filter to
      # plain x.y.z and take the highest.
      - name: Resolve the newest stable Kotlin
        id: kotlin
        run: |
          set -euo pipefail
          version=$(curl -fsSL --retry 3 \
            https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/maven-metadata.xml \
            | sed -n 's|.*<version>\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)</version>.*|\1|p' \
            | sort -V | tail -n 1)
          [ -n "$version" ] || { echo "could not resolve the newest Kotlin release" >&2; exit 1; }
          echo "Newest stable Kotlin: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Fails for a Kotlin line no variant claims (for example the first 2.5.x), which is the signal
      # to add a variant or widen one.
      - name: Compose variant matrix
        run: ./gradlew :compose-compiler-plugin:composeVariantMatrix -Pbugsee.matrix.extraKotlin=${{ steps.kotlin.outputs.version }}

      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-newest-kotlin
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 3
