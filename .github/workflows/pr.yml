name: PR

# DIAGNOSTIC, DO NOT MERGE. Runs the exact production Build step (RELEASE=true) WITH the harness fix from the
# fix/forward-release-to-fixture-builds branch merged in, and keeps the reports.
on:
  pull_request:
    branches: [main, release]

permissions:
  contents: read

jobs:
  # Exactly what the production Build step runs.
  production-build:
    name: diag production Build step WITH the fix (build.sh --full, RELEASE=true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - name: bash -xe ./scripts/build.sh --full
        continue-on-error: true
        run: bash -xe ./scripts/build.sh --full
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-production-build-with-fix
          path: build/test-results/integrationTest/
          retention-days: 2
