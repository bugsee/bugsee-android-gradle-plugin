name: PR

# Runs the full build on every pull request: unit tests, the TestKit
# integration tests (real AGP builds of fixture apps) and the Compose
# compiler-plugin variant matrix. That is `scripts/build.sh --full`, which takes
# ~35 minutes on one hosted runner, so it runs here as parallel jobs, one piece
# each (`unit`, `compose`, and the TestKit suite in `integration` shards), and the
# `build.sh --full` job at the end is their aggregate, so the check keeps its name.
on:
  pull_request:
    branches: [main, release]

# Superseded runs for the same PR are cancelled: only the latest push matters,
# and hosted minutes are billed.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── The pieces of `build.sh --full`, in parallel ──────────────────────────
  # GitHub-hosted. The image ships the Android SDK (ANDROID_SDK_ROOT is set) with its licenses accepted, which
  # the integration tests' fixture apps need.

  unit:
    name: unit tests + buildSrc + CLI contract
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RELEASE: "false"

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Build and test
        run: bash -xe ./scripts/build.sh --unit

      # The real-binary CLI contract test (CliUploaderRealBinaryTest) only runs
      # when BUGSEE_CLI_BIN is set, so without this it is skipped everywhere and
      # drifts from the CLI unnoticed (issue #14). The fetch (the CLI version the
      # plugin itself pins, SHA-256 checked) lives in the shared local action, which
      # the toolchain legs use too; then run just that test class with it.
      # BUGSEE_CLI_BIN is scoped to the gradle step. It runs after the main build,
      # and still on its failure, so neither masks the other's result.
      - name: Fetch bugsee-cli
        id: cli
        if: success() || failure()
        uses: ./.github/actions/fetch-bugsee-cli

      - name: Real-binary bugsee-cli contract test
        if: success() || failure()
        timeout-minutes: 15
        env:
          BUGSEE_CLI_BIN: ${{ steps.cli.outputs.bin }}
        run: |
          set -euo pipefail
          ./gradlew :test --tests '*CliUploaderRealBinaryTest*' --tests '*CliNoProxyContractTest*'
          # Every test in these classes Assume-skips without the binary, and a skip is green:
          # fail unless each class actually ran.
          for cls in CliUploaderRealBinaryTest CliNoProxyContractTest; do
            report=build/test-results/test/TEST-com.bugsee.android.gradle.upload.$cls.xml
            if [ ! -f "$report" ] || ! grep -q 'skipped="0"' "$report" || grep -q 'tests="0"' "$report"; then
              echo "real-binary tests ($cls) were skipped or did not run" >&2
              exit 1
            fi
          done

      # Only on failure, and kept briefly: the org's Actions artifact storage
      # is shared across every repo and capped, and a green run needs no reports.
      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-unit-pr${{ github.event.pull_request.number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 3

  compose:
    name: compose-compiler-plugin variants
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      RELEASE: "false"

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: Build the Compose compiler plugin and its variant matrix
        run: bash -xe ./scripts/build.sh --compose

      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-compose-pr${{ github.event.pull_request.number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 3

  # The TestKit suite (real AGP builds of fixture apps) on the declared minimums (Gradle 8.7, AGP 8.6.0,
  # Kotlin 2.1.0), split into shards that run in parallel. The tests of each shard are listed in
  # `integrationShards` in build.gradle.kts; the last shard runs everything not listed, so a new test class
  # cannot fall out of CI. The matrix below MUST list every shard 1..N (N = the lists there + 1): the build
  # fails a job whose matrix size differs from its own shard count, so a missing shard cannot hide.
  integration:
    name: integration shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One failing shard must not hide the results of the others.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    env:
      RELEASE: "false"

    steps:
      - name: Checkout PR merge commit
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build

      - name: TestKit shard
        run: bash -xe ./scripts/build.sh --integration ${{ matrix.shard }} ${{ strategy.job-total }}

      # Where the time went in this shard, to rebalance `integrationShards` from real numbers.
      - name: Test timings
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          rows = []
          for f in glob.glob("build/test-results/integrationTest/TEST-*.xml"):
              r = ET.parse(f).getroot()
              rows.append((float(r.get("time")), r.get("name").split(".")[-1], int(r.get("tests"))))
          rows.sort(reverse=True)
          print(f"shard ${{ matrix.shard }}: {len(rows)} classes, {sum(r[2] for r in rows)} tests, {sum(r[0] for r in rows)/60:.1f} min of test time")
          for t, n, c in rows[:25]:
              print(f"  {t:7.1f}s  {n}  ({c} tests)")
          PY

      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-integration-${{ matrix.shard }}-pr${{ github.event.pull_request.number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 3

  # The aggregate of the pieces above: the check that used to be one 35-minute job, kept under its old
  # name. It fails unless every piece succeeded (a cancelled or skipped piece counts as a failure).
  full:
    name: build.sh --full
    needs: [unit, compose, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every piece must have succeeded
        env:
          UNIT: ${{ needs.unit.result }}
          COMPOSE: ${{ needs.compose.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "unit=$UNIT compose=$COMPOSE integration=$INTEGRATION"
          [ "$UNIT" = success ] && [ "$COMPOSE" = success ] && [ "$INTEGRATION" = success ]

  # Newer Gradle / AGP / Kotlin than the declared minimums that `build.sh --full` runs on (Gradle 8.7,
  # AGP 8.6.0, Kotlin 2.1.0). Runs the same TestKit suite against each entry, so a regression that
  # only shows on a newer toolchain fails here before release (issue #59). The versions are plain
  # data: bump a row here and nothing else. Pairs must be compatible with each other (AGP 8.13 does
  # not run on Gradle 9.7+, see README "Gradle 9"), and every entry is something that passes locally:
  #   ./gradlew integrationTest -Pbugsee.it.gradleVersion=<gradle> -Pbugsee.it.agpVersion=<agp> \
  #     -Pbugsee.it.kotlinVersion=<kotlin>
  # The plugin itself is built by the wrapper's Gradle and handed to the fixtures as a jar.
  toolchain:
    name: integration (gradle ${{ matrix.gradle }}, agp ${{ matrix.agp }}, kotlin ${{ matrix.kotlin }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One broken pairing must not hide the result of the other.
      fail-fast: false
      matrix:
        include:
          # Gradle 9 floor, last AGP 8.x, a Kotlin patch release between 2.2.0 and 2.2.21.
          - { gradle: "9.0.0", agp: "8.13.2", kotlin: "2.2.20" }
          # Newest verified Gradle 9 with AGP 9 (compiles Kotlin itself; the fixtures opt out, see
          # FixtureProject.agp9Compat) and Kotlin 2.3.
          - { gradle: "9.8.0", agp: "9.4.1", kotlin: "2.3.20" }

    env:
      RELEASE: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Pre-create the Android user cache
        run: mkdir -p ~/.android/cache

      # NativeMergedLibsE2ETest (the NDK symbol path through AGP) Assume-skips without a real
      # bugsee-cli, and a skip is green; so the legs get the same pinned CLI as the `unit` job.
      - name: Fetch bugsee-cli
        id: cli
        uses: ./.github/actions/fetch-bugsee-cli

      # ToolchainMatrixTest fails the leg if the fixtures did not really run on the requested
      # versions, so a mistyped or ignored property cannot leave a leg green on the defaults.
      - name: TestKit suite
        env:
          BUGSEE_CLI_BIN: ${{ steps.cli.outputs.bin }}
        run: >
          ./gradlew integrationTest
          -Pbugsee.it.gradleVersion=${{ matrix.gradle }}
          -Pbugsee.it.agpVersion=${{ matrix.agp }}
          -Pbugsee.it.kotlinVersion=${{ matrix.kotlin }}

      # Fail if the native tests were skipped or absent, rather than trusting a green skip.
      - name: Native tests actually ran
        run: |
          report=build/test-results/integrationTest/TEST-com.bugsee.android.gradle.integration.NativeMergedLibsE2ETest.xml
          if [ ! -f "$report" ] || ! grep -q ' skipped="0"' "$report" || grep -q ' tests="0"' "$report"; then
            echo "NativeMergedLibsE2ETest was skipped or did not run" >&2
            exit 1
          fi

      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-toolchain-${{ matrix.gradle }}-${{ matrix.agp }}-${{ matrix.kotlin }}-pr${{ github.event.pull_request.number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 3

  # The plugin downloads and runs a native `bugsee-cli` and is used from Windows developer machines,
  # so the pieces that touch the OS get a Windows run: the CLI resolver and uploader unit tests, plus
  # one real TestKit build (debug and release assemble of a fixture app).
  # Deliberately small: Windows minutes cost double, and the rest of the suite is OS-independent.
  windows:
    name: windows (CLI + TestKit smoke)
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      RELEASE: "false"

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            11
            17

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Pre-create the Android user cache
        run: mkdir -p ~/.android/cache

      - name: CLI resolver and uploader unit tests
        run: ./gradlew :test --tests '*CliBinaryResolverTest*' --tests '*CliUploaderTest*'

      # One real AGP build (debug and release assemble) plus the toolchain guard. Gradle 8.7 is
      # named explicitly on purpose: it makes the fixtures consume the pre-built plugin jar from
      # build/integrationTest/plugin-repo instead of an included build of this checkout, and no
      # test here runs `clean`, so a live TestKit daemon holding files open cannot break a delete
      # on Windows. Not required until it has been seen green (it cannot be run off Windows).
      - name: TestKit smoke test
        run: >
          ./gradlew integrationTest
          --tests '*BuildTypeGatingTest*' --tests '*ToolchainMatrixTest*'
          -Pbugsee.it.gradleVersion=8.7

      - name: Upload test reports
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows-pr${{ github.event.pull_request.number }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 3
