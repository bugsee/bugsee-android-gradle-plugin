GROUP=com.bugsee
POM_ARTIFACT_ID=bugsee-android-gradle-plugin

POM_NAME=Bugsee Android Gradle Plugin
POM_DESCRIPTION=Gradle plugin for Bugsee to automatically upload ProGuard mapping files and instrument OkHttp
POM_URL=https://www.bugsee.com

POM_DEVELOPER_NAME=Bugsee, Inc.
POM_DEVELOPER_URL=https://www.bugsee.com

POM_PACKAGING=jar

# Maven Central requires .md5 and .sha1 beside each published file (jar, pom, .module, sources
# jar, javadoc jar) and its .asc signature. .sha256 and .sha512 are optional, and Central does
# not generate them when the publisher omits them. Gradle 8.7's maven-publish plugin uploads
# all four algorithms, for every file AND for every .asc signature, which is why each version
# directory carried 10 files per artifact. This internal switch (Gradle 6.0.1+) skips only the
# two optional algorithms; .md5/.sha1, PGP signatures, Gradle Module Metadata and the
# sources/javadoc jars Central's close rules require are unaffected. The name says "insecure"
# because the Gradle team treats dropping the stronger hashes as a compatibility workaround:
# authenticity of a Central deploy is the .asc signature; these checksums only detect
# corruption, and SHA-1 still does that.
#
# Checksums of the signatures themselves (.asc.md5, .asc.sha1) are also not required. Gradle 8.7
# has no switch for those, so the sonatype publish tasks (build.gradle.kts) stage into a local
# Maven directory, delete them, and upload the rest (buildSrc MavenSignatureChecksums).
# Gradle 9.7 stops emitting the signature checksums, at which point that staging can go.
systemProp.org.gradle.internal.publish.checksums.insecure=true

# Build heap. The Gradle defaults (512m daemon, Kotlin daemon inheriting it) intermittently die
# with "GC overhead limit exceeded" in :compose-compiler-plugin:compileKotlin and compileTestKotlin,
# so the build no longer depends on per-workflow -Xmx flags. The Kotlin daemon is set explicitly
# so its heap does not silently track org.gradle.jvmargs. Setting org.gradle.jvmargs replaces
# Gradle's defaults, so -XX:+HeapDumpOnOutOfMemoryError is repeated to keep the default behaviour
# (dumps are git-ignored) and the former -XX:MaxMetaspaceSize=384m cap is intentionally gone.
org.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4g
