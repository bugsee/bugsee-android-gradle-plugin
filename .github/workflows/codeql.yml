name: CodeQL

# Advanced setup, replacing GitHub's default setup. The default setup's
# java-kotlin autobuild failed (`:compose-compiler-plugin:compileKotlin`) and
# left the repository with a permanent "CodeQL exited with errors" banner, so
# Kotlin is built explicitly here with the same JDK and Gradle setup as pr.yml.
# The default setup must be switched off (Settings -> Code security -> CodeQL
# analysis) BEFORE this runs: GitHub rejects advanced-configuration uploads
# while the default setup is enabled ("CodeQL analyses from advanced
# configurations cannot be processed when the default setup is enabled").
on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]
  schedule:
    - cron: "17 5 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
          # Only the native-merged-libs integration-test fixture.
          - language: c-cpp
            build-mode: none

    steps:
      - uses: actions/checkout@v7
        with:
          # The build needs no authenticated git access, so do not leave the
          # token in .git/config while repository-controlled Gradle code runs.
          persist-credentials: false

      # JDK 11 for `jvmToolchain(11)` (not auto-provisioned), 17 as JAVA_HOME
      # to run Gradle, as in pr.yml.
      - uses: actions/setup-java@v6
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: |
            11
            17

      - uses: gradle/actions/setup-gradle@v6
        if: matrix.language == 'java-kotlin'
        with:
          cache-provider: basic

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Compile the plugin only: the tests and the fixture apps' AGP builds are
      # not part of the scanned code and are covered by pr.yml. The CodeQL tracer
      # adds heap pressure ("GC overhead limit exceeded" in
      # :compose-compiler-plugin:compileKotlin at the old default heap). The heap
      # comes from org.gradle.jvmargs in gradle.properties (compilation is
      # in-process here); do not add a per-workflow -Xmx.
      # The Kotlin extractor only sees compilers started inside the traced
      # process tree, so compile in-process (not in the long-lived Kotlin
      # daemon) and force every task to run (no build cache, no up-to-date skip),
      # otherwise the Kotlin database can end up empty with a green job.
      - name: Build plugin
        if: matrix.language == 'java-kotlin'
        run: >
          ./gradlew --no-daemon --no-build-cache --rerun-tasks
          -Pkotlin.compiler.execution.strategy=in-process
          assemble -x test

      # Fail loudly instead of publishing an empty Kotlin database: the
      # extractor copies every source file it extracted into its source archive.
      - name: Verify Kotlin extraction
        if: matrix.language == 'java-kotlin'
        run: |
          src="$CODEQL_EXTRACTOR_JAVA_SOURCE_ARCHIVE_DIR"
          kt=$(find "$src" -name '*.kt' | wc -l)
          java=$(find "$src" -name '*.java' | wc -l)
          echo "Extracted into the CodeQL source archive: $kt Kotlin, $java Java files"
          if [ "$kt" -eq 0 ]; then
            echo "::error::CodeQL extracted no Kotlin sources; the Kotlin compiler did not run under the CodeQL tracer"
            exit 1
          fi

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
