android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official
# Sets the project group so the plugin's auto-install logic treats this as
# an internal Bugsee module and SKIPS auto-adding the SDK dependency. The
# fixture pins the stub-SDK jar as compileOnly instead.
group=com.bugsee.testfixture
