name: PR

# DIAGNOSTIC, DO NOT MERGE. Reproduces the 4.1.1 production-deploy failure (ComposePluginOrderTest, RELEASE=true)
# on a hosted runner and keeps the reports, which the production workflow does not upload.
on:
  pull_request:
    branches: [main, release]

permissions:
  contents: read

jobs:
  diag:
    name: diag compose release (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [test-only, build-then-test]
    env:
      RELEASE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - name: Build the compose compiler plugin first (as the production build does)
        if: matrix.variant == 'build-then-test'
        run: ./gradlew clean :compose-compiler-plugin:build
      - name: ComposePluginOrderTest with RELEASE=true
        continue-on-error: true
        run: ./gradlew integrationTest --tests '*ComposePluginOrderTest*' -i 2>&1 | tee /tmp/compose-test.log
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diag-${{ matrix.variant }}
          path: |
            /tmp/compose-test.log
            build/test-results/integrationTest/
          retention-days: 2
